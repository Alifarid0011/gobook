name: Portable desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      GOBOOK_NATIVE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/native_ui.test.cjs tests/desktop_ui.test.cjs tests/cell_output_ui.test.cjs
      - name: Native tests
        run: go test -p 2 ./...
      - run: go vet ./...
      - name: Linux launcher checks and package
        if: matrix.os == 'linux'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          bash packaging/test-linux.sh
          bash packaging/build-linux.sh "$VERSION" "$ARCH"
          cd dist
          sha256sum -c "gobook-$VERSION-linux-$ARCH.tar.gz.sha256"
          mkdir extracted
          tar -xzf "gobook-$VERSION-linux-$ARCH.tar.gz" -C extracted
          echo "GOBOOK_SMOKE_BINARY=$PWD/extracted/gobook-$VERSION-linux-$ARCH/gobook" >> "$GITHUB_ENV"
      - name: Windows launcher checks and package
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          ./packaging/test-windows.ps1
          ./packaging/build-windows.ps1 -Version $env:VERSION -Arch $env:ARCH
          $name = "gobook-$env:VERSION-windows-$env:ARCH"
          $archive = "dist/$name.zip"
          $expected = (Get-Content "$archive.sha256").Split(' ')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Archive checksum mismatch' }
          Expand-Archive $archive -DestinationPath dist/extracted
          "GOBOOK_SMOKE_BINARY=$((Get-Item "dist/extracted/$name/gobook.exe").FullName)" >> $env:GITHUB_ENV
      - name: Extracted executable runtime check
        run: go test ./packaging -run 'TestPortableRuntime|TestDesktopRuntime' -count=1 -v
      - uses: actions/upload-artifact@v4
        with:
          name: gobook-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes
          fi
          gh release upload "$VERSION" dist/* --clobber
