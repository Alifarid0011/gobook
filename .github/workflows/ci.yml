name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Go language server
        env:
          CGO_ENABLED: '0'
        run: go install golang.org/x/tools/gopls@v0.20.0
      - run: node --test tests/native_ui.test.cjs tests/desktop_ui.test.cjs tests/cell_output_ui.test.cjs tests/completion_ui.test.cjs
      - run: go test -p 2 ./...
        env:
          GOBOOK_NATIVE_INTEGRATION: '1'
          GOBOOK_GOPLS: gopls
      - run: go vet ./...
      - run: go build ./...
